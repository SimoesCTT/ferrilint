[workspace]
resolver = "3"
members = [
    "rpm-parse-rs",
    "elf-inspect-rs",
    "spec-lex-rs",
    "ferrilint-cli",
    "ferrilint-bench"
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["A. Simões <simoesctt@github>"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
nom = "8.0"
scroll = "0.12"
thiserror = "2.0"
anstream = "0.6"
clap = { version = "4.5", features = ["derive"] }
rayon = "1.10"
spdx = "0.10"
walkdir = "2.5"
