[workspace]
resolver = "3"
members = [
    "rpm-parse-rs",
    "elf-inspect-rs",
    "spec-lex-rs",
    "ferrilint-cli",
    "ferrilint-bench"
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["A. Simões <simoesctt@github>"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
thiserror = "2.0"
clap = { version = "4.5", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
clap_complete = "4.5"
rayon = "1.10"
spdx = "0.13"
walkdir = "2.5"
regex = "1.11"
